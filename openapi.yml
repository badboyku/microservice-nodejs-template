openapi: '3.1.1'
info:
  # Title and Version get overwritten in the api-docs route
  title: ''
  version: ''
tags:
  - name: Misc
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: Get health
      description: Check app health status
      operationId: getHealth
      tags: ['Misc']
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHealthResponse'
              example:
                ok: true
                data:
                  status: ok
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHealthResponse'
              example:
                ok: false
                data:
                  status: not ok

components:
  responses:
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
          examples:
            DevMode:
              summary: Unauthorized error - development mode
              value:
                ok: false
                error: Some error message
            ProdMode:
              summary: Unauthorized error - production mode (hide actual error message)
              value:
                ok: false
                error: Unauthorized
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    ApiErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: status of request
          example: false
        error:
          type: string
          description: error message
          example: some error message

    GetHealthResponse:
      type: object
      properties:
        ok:
          type: boolean
          description: status of request
          example: true
        data:
          type: object
          properties:
            status:
              type: string
              example: ok

  securitySchemes:
    bearerAuth:
      type: http
      description: JWT Token
      scheme: bearer
      bearerFormat: JWT
